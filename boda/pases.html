<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pases de invitados · Mariana & Diego</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f4eee3" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="../assets/fuentes/cormorant-garamond-latin-52ea38a7.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../assets/fuentes/cormorant-garamond-latin-74db058f.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../assets/fuentes/jost-latin-d3fc5b41.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../assets/fuentes/cormorantgaramond-jost-652c76.css" />
  <link rel="stylesheet" href="../assets/iconos/iconos.css?v=2" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="../assets/muestra.css?v=4" />
</head>
<body>
  <!-- Aviso de ejemplo (ficticio) con regreso y cotizador. Para un cliente real, borra este bloque. -->
  <div class="mu-barra" role="note">
    <span><strong>Ejemplo ficticio</strong><span class="mu-barra-quien"> · hecho por yalech</span></span>
    <a href="../">← Más ejemplos</a>
    <a class="mu-barra-cta" href="../?cotizar=invitacion&amp;ejemplo=Boda">Quiero una así</a>
  </div>
  <!-- Página para los novios (no se enlaza desde la invitación). Crea el enlace personal de cada
       invitado y lo manda por WhatsApp. La lista se guarda solo en este navegador. -->
  <main class="section">
    <div class="wrap narrow">
      <div class="center">
        <p class="eyebrow">Solo para los novios</p>
        <h1 class="h2">Pases de <em>invitados</em></h1>
        <p class="lead">Escribe el nombre y cuántos lugares tiene. Cada invitado recibe su propio enlace, con su nombre en el sobre.</p>
      </div>

      <form class="rsvp" id="pase-form" novalidate>
        <label class="field">
          <span>Nombre en el pase</span>
          <input name="nombre" required maxlength="60" placeholder="Ej. Familia López" autocomplete="off" />
        </label>
        <label class="field">
          <span>Lugares</span>
          <select name="lugares"></select>
        </label>
        <p class="form-error" hidden></p>
        <button class="btn btn--gold" type="submit"><i class="fa-solid fa-plus"></i> Crear pase</button>
      </form>

      <div class="passes-head" hidden>
        <h2 class="h3">Pases creados</h2>
        <span data-total></span>
      </div>
      <ul class="passes" data-lista></ul>

      <p class="center" style="margin-top: 40px"><a class="btn btn--line" href="./">Ver la invitación</a></p>
    </div>
  </main>

  <footer class="footer footer--min">
    <a class="credit" href="../">Hecho por yalech · más ejemplos →</a>
  </footer>

  <script src="pases.js?v=1"></script>
  <!-- Modo muestra (ejemplo ficticio). Para un cliente real, borra la siguiente línea. -->
  <script src="../assets/muestra.js?v=4" data-servicio="invitacion" data-ejemplo="Boda" data-para="Mariana &amp; Diego"></script>
  <script src="../assets/errores.js?v=1"></script>
</body>
</html>
